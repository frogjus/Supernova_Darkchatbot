<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Sohee - transparent background -->

  <!-- Hair (steel blue-gray) -->
  <rect x="14" y="6" width="36" height="18" fill="#5c6d7e"/>
  <rect x="10" y="8" width="4" height="24" fill="#5c6d7e"/>
  <rect x="50" y="8" width="4" height="24" fill="#5c6d7e"/>
  <rect x="16" y="4" width="32" height="4" fill="#4a5a6a"/>

  <!-- Face (pale) -->
  <rect x="18" y="18" width="28" height="26" fill="#e8dcd0"/>

  <!-- Eyes (flat, distant) -->
  <rect x="22" y="26" width="6" height="4" fill="#2d2d2d"/>
  <rect x="36" y="26" width="6" height="4" fill="#2d2d2d"/>

  <!-- Eyebrows (neutral) -->
  <rect x="22" y="24" width="6" height="1" fill="#4a4a4a"/>
  <rect x="36" y="24" width="6" height="1" fill="#4a4a4a"/>

  <!-- Mouth (thin line) -->
  <rect x="28" y="38" width="8" height="1" fill="#8b6b6b"/>

  <!-- Outfit -->
  <rect x="18" y="44" width="28" height="12" fill="#7c9eb2"/>
  <rect x="22" y="46" width="20" height="2" fill="#a8c4d4"/>

  <!-- Minimal details -->
  <rect x="16" y="10" width="2" height="10" fill="#6b7d8e"/>
</svg>
