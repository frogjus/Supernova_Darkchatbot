<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="64" height="64" fill="#1a1a2e"/>

  <!-- Hair (bright yellow-gold) -->
  <rect x="12" y="6" width="40" height="16" fill="#ffd700"/>
  <rect x="8" y="8" width="4" height="22" fill="#ffd700"/>
  <rect x="52" y="8" width="4" height="22" fill="#ffd700"/>

  <!-- Face (warm tan) -->
  <rect x="16" y="18" width="32" height="26" fill="#f5d0a9"/>

  <!-- Eyes (bright, energetic) -->
  <ellipse cx="23" cy="28" rx="5" ry="6" fill="#2d2d2d"/>
  <ellipse cx="41" cy="28" rx="5" ry="6" fill="#2d2d2d"/>
  <ellipse cx="24" cy="27" rx="2" ry="2" fill="#fff"/>
  <ellipse cx="42" cy="27" rx="2" ry="2" fill="#fff"/>

  <!-- Eyebrows (determined) -->
  <rect x="18" y="24" width="10" height="2" fill="#8b6914"/>
  <rect x="36" y="24" width="10" height="2" fill="#8b6914"/>

  <!-- Mouth (big smile - always performing) -->
  <rect x="24" y="38" width="16" height="4" fill="#c94c4c"/>

  <!-- Outfit -->
  <rect x="16" y="44" width="32" height="12" fill="#ffd54f"/>
  <rect x="20" y="46" width="24" height="2" fill="#ffe082"/>

  <!-- Energy sparkles -->
  <rect x="10" y="4" width="2" height="2" fill="#fff"/>
  <rect x="52" y="4" width="2" height="2" fill="#fff"/>
  <rect x="8" y="14" width="2" height="2" fill="#ffec8b"/>
  <rect x="54" y="14" width="2" height="2" fill="#ffec8b"/>
</svg>