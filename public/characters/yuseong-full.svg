<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <!-- Yuseong - The predator, dark purple theme -->

  <!-- Hair back -->
  <path d="M40 55 Q20 85 20 150 L20 230 Q25 270 45 290 L45 170 Z" fill="#4a148c"/>
  <path d="M160 55 Q180 85 180 150 L180 230 Q175 270 155 290 L155 170 Z" fill="#4a148c"/>
  <path d="M30 45 Q10 65 15 110 L25 90 Z" fill="#4a148c"/>
  <path d="M170 45 Q190 65 185 110 L175 90 Z" fill="#4a148c"/>

  <!-- Neck -->
  <rect x="85" y="130" width="30" height="30" fill="#e8dcd0"/>

  <!-- Outfit - smart suit, predatory -->
  <path d="M45 160 Q100 150 155 160 L160 290 Q100 300 40 290 Z" fill="#1a1a2e"/>
  <path d="M55 165 L145 165 L142 190 L58 190 Z" fill="#2a2a3e"/>
  <!-- Suit lapels -->
  <path d="M75 165 L100 220 L100 165 Z" fill="#4a148c"/>
  <path d="M125 165 L100 220 L100 165 Z" fill="#4a148c"/>
  <!-- Tie -->
  <path d="M95 170 L105 170 L100 220 Z" fill="#9c27b0"/>

  <!-- Arms - crossed, defensive posture -->
  <path d="M45 175 Q20 220 35 280" stroke="#e8dcd0" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M155 175 Q180 220 165 280" stroke="#e8dcd0" stroke-width="16" fill="none" stroke-linecap="round"/>

  <!-- Hands -->
  <circle cx="35" cy="285" r="11" fill="#e8dcd0"/>
  <circle cx="165" cy="285" r="11" fill="#e8dcd0"/>

  <!-- Face -->
  <ellipse cx="100" cy="90" rx="42" ry="48" fill="#e8dcd0"/>

  <!-- Hair front - slick, controlled -->
  <path d="M55 42 Q100 15 145 42 Q160 65 155 90 Q135 55 100 50 Q65 55 45 90 Q40 65 55 42" fill="#4a148c"/>
  <path d="M52 50 Q42 80 48 105" stroke="#4a148c" stroke-width="10" fill="none"/>
  <path d="M148 50 Q158 80 152 105" stroke="#4a148c" stroke-width="10" fill="none"/>

  <!-- Hair top -->
  <path d="M60 32 Q100 20 140 32 Q145 40 140 45 Q100 30 60 45 Q55 40 60 32" fill="#4a148c"/>

  <!-- Hair shine -->
  <path d="M70 35 Q85 28 100 30" stroke="#6a2c7a" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M120 30 Q140 28 150 38" stroke="#6a2c7a" stroke-width="3" fill="none" opacity="0.7"/>

  <!-- Eyes - cold, calculating, predatory -->
  <ellipse cx="78" cy="90" rx="10" ry="11" fill="#1a1a1a"/>
  <ellipse cx="122" cy="90" rx="10" ry="11" fill="#1a1a1a"/>
  <!-- Shine -->
  <ellipse cx="76" cy="87" rx="3" ry="3" fill="#6a1b9a"/>
  <ellipse cx="120" cy="87" rx="3" ry="3" fill="#6a1b9a"/>
  <!-- Slight glint -->
  <circle cx="80" cy="93" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="124" cy="93" r="1.5" fill="#fff" opacity="0.3"/>

  <!-- Eyebrows - slightly raised, smirking -->
  <path d="M66 76 Q78 73 88 76" stroke="#2a2a2a" stroke-width="2" fill="none"/>
  <path d="M112 76 Q122 73 134 76" stroke="#2a2a2a" stroke-width="2" fill="none"/>

  <!-- No blush - he's calculating -->

  <!-- Mouth - smirk -->
  <path d="M88 120 Q100 126 112 120" stroke="#6a4a4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Slight smile line -->
  <path d="M88 122 L92 122" stroke="#fff" stroke-width="0.5" opacity="0.3"/>

  <!-- Shadow under eyes -->
  <ellipse cx="78" cy="100" rx="8" ry="3" fill="#4a148c" opacity="0.2"/>
  <ellipse cx="122" cy="100" rx="8" ry="3" fill="#4a148c" opacity="0.2"/>
</svg>
