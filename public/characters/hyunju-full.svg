<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <!-- Hyunju - The runner, ember orange theme -->

  <!-- Hair back - dynamic, bouncy -->
  <path d="M40 50 Q20 80 25 160 L25 220 Q30 260 50 280 L50 180 Z" fill="#ffd700"/>
  <path d="M160 50 Q180 80 175 160 L175 220 Q170 260 150 280 L150 180 Z" fill="#ffd700"/>
  <path d="M30 40 Q10 60 20 100 L30 80 Z" fill="#ffd700"/>
  <path d="M170 40 Q190 60 180 100 L170 80 Z" fill="#ffd700"/>

  <!-- Neck -->
  <rect x="85" y="130" width="30" height="30" fill="#f5d0a9"/>

  <!-- Outfit - energetic orange/yellow -->
  <path d="M45 160 Q100 150 155 160 L165 280 Q100 300 35 280 Z" fill="#ff8a65"/>
  <path d="M55 165 L145 165 L140 185 L60 185 Z" fill="#ffab91"/>
  <path d="M70 190 L130 190 L125 270 L75 270 Z" fill="#ff8a65" opacity="0.9"/>

  <!-- Dynamic pose lines - she's always moving -->
  <path d="M40 200 L25 230" stroke="#ff5722" stroke-width="2" opacity="0.5"/>
  <path d="M160 200 L175 230" stroke="#ff5722" stroke-width="2" opacity="0.5"/>

  <!-- Arms - raised slightly, energetic -->
  <path d="M45 170 Q20 200 25 270" stroke="#f5d0a9" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M155 170 Q180 200 175 270" stroke="#f5d0a9" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- Hands - always ready -->
  <circle cx="25" cy="275" r="12" fill="#f5d0a9"/>
  <circle cx="175" cy="275" r="12" fill="#f5d0a9"/>

  <!-- Face -->
  <ellipse cx="100" cy="90" rx="45" ry="50" fill="#f5d0a9"/>

  <!-- Hair front - big and bouncy -->
  <path d="M55 40 Q100 10 145 40 Q160 60 155 85 Q140 50 100 45 Q60 50 45 85 Q40 60 55 40" fill="#ffd700"/>
  <path d="M50 45 Q45 70 50 100" stroke="#ffd700" stroke-width="10" fill="none"/>
  <path d="M150 45 Q155 70 150 100" stroke="#ffd700" stroke-width="10" fill="none"/>

  <!-- Hair bangs - energetic spikes -->
  <path d="M55 50 L65 35 L75 50 L85 38 L100 50 L115 38 L125 50 L135 35 L145 50" fill="#ffd700"/>

  <!-- Hair highlights -->
  <path d="M65 35 Q80 25 100 30" stroke="#fff5cc" stroke-width="4" fill="none" opacity="0.8"/>
  <path d="M120 30 Q140 25 150 35" stroke="#fff5cc" stroke-width="4" fill="none" opacity="0.8"/>

  <!-- Eyes - bright, slightly manic energy -->
  <ellipse cx="80" cy="90" rx="12" ry="14" fill="#2d2d2d"/>
  <ellipse cx="120" cy="90" rx="12" ry="14" fill="#2d2d2d"/>
  <ellipse cx="82" cy="87" rx="4" ry="5" fill="#fff"/>
  <ellipse cx="122" cy="87" rx="4" ry="5" fill="#fff"/>
  <!-- Energy sparkles in eyes -->
  <circle cx="78" cy="85" r="2" fill="#ffd700"/>
  <circle cx="118" cy="85" r="2" fill="#ffd700"/>

  <!-- Eyebrows - determined, slightly stressed -->
  <path d="M68 72 Q80 68 90 72" stroke="#8b6914" stroke-width="2.5" fill="none"/>
  <path d="M110 72 Q120 68 132 72" stroke="#8b6914" stroke-width="2.5" fill="none"/>

  <!-- Blush -->
  <ellipse cx="68" cy="108" rx="10" ry="5" fill="#ffab91" opacity="0.8"/>
  <ellipse cx="132" cy="108" rx="10" ry="5" fill="#ffab91" opacity="0.8"/>

  <!-- Mouth - big forced smile -->
  <path d="M85 118 Q100 128 115 118" stroke="#c94c4c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M95 122 L105 122" stroke="#fff" stroke-width="1" opacity="0.5"/>

  <!-- Earrings - small hoops -->
  <circle cx="55" cy="105" r="4" stroke="#ffd700" stroke-width="2" fill="none"/>
  <circle cx="145" cy="105" r="4" stroke="#ffd700" stroke-width="2" fill="none"/>

  <!-- Energy sparkles around -->
  <circle cx="30" cy="60" r="2" fill="#ffec8b"/>
  <circle cx="170" cy="60" r="2" fill="#ffec8b"/>
  <circle cx="25" cy="150" r="1.5" fill="#ff5722" opacity="0.7"/>
  <circle cx="175" cy="150" r="1.5" fill="#ff5722" opacity="0.7"/>
</svg>
