<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Yuseong - transparent background -->

  <!-- Hair (dark purple) -->
  <rect x="14" y="6" width="36" height="16" fill="#4a148c"/>
  <rect x="10" y="8" width="4" height="22" fill="#4a148c"/>
  <rect x="50" y="8" width="4" height="22" fill="#4a148c"/>

  <!-- Face (pale, sinister) -->
  <rect x="18" y="18" width="28" height="26" fill="#e8dcd0"/>

  <!-- Eyes (cold, calculating) -->
  <rect x="20" y="26" width="8" height="6" fill="#1a1a1a"/>
  <rect x="36" y="26" width="8" height="6" fill="#1a1a1a"/>

  <!-- Shine in eyes -->
  <rect x="22" y="27" width="2" height="2" fill="#6a1b9a"/>
  <rect x="38" y="27" width="2" height="2" fill="#6a1b9a"/>

  <!-- Eyebrows (sneering) -->
  <rect x="20" y="24" width="8" height="1" fill="#2a2a2a"/>
  <rect x="36" y="24" width="8" height="1" fill="#2a2a2a"/>

  <!-- Mouth (smirk) -->
  <rect x="26" y="36" width="12" height="3" fill="#6a4a4a"/>

  <!-- Outfit -->
  <rect x="16" y="44" width="32" height="12" fill="#9c27b0"/>
  <rect x="20" y="46" width="24" height="2" fill="#ce93d8"/>

  <!-- Shadow effect -->
  <rect x="14" y="10" width="2" height="12" fill="#2a0a5c"/>
  <rect x="48" y="10" width="2" height="12" fill="#2a0a5c"/>
</svg>
